name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/sealos-console
      - if: runner.os == 'Linux'
        run: go test -race ./...
