name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
      - run: go test ./...
      - name: Verify upstream skill lifecycle in an isolated project
        run: go test ./internal/console -run '^TestVercelSkillsIntegration$' -count=1 -v
        env:
          SEALOS_CONSOLE_SKILL_INTEGRATION: '1'
      - run: go vet ./...
      - run: go build -trimpath ./cmd/sealos-console
      - if: runner.os == 'Linux'
        run: go test -race ./...
